name: Preview Environment Links

on:
  deployment_status:

jobs:
  comment-preview-links:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      deployments: read
    steps:
      - name: Check deployments and comment
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.deployment.sha;
            
            // Find PRs associated with this commit
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha
            });
            
            if (prs.length === 0) {
              console.log('No PR associated with this deployment/commit.');
              return;
            }
            const pr = prs[0];
            
            // Fetch all deployments for this SHA
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha
            });
            
            let frontendUrl = '';
            let backendUrl = '';
            
            for (const dep of deployments) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: dep.id
              });
              
              const successStatus = statuses.find(s => s.state === 'success');
              if (successStatus && successStatus.environment_url) {
                const url = successStatus.environment_url;
                if (url.includes('vercel')) frontendUrl = url;
                // We'll also fallback to checking creator login or app name if url doesn't match
                else if (url.includes('onrender.com') || url.includes('render')) backendUrl = url;
                else {
                   // Fallback checks
                   if (dep.creator && dep.creator.login && dep.creator.login.toLowerCase().includes('vercel')) frontendUrl = url;
                   if (dep.creator && dep.creator.login && dep.creator.login.toLowerCase().includes('render')) backendUrl = url;
                }
              }
            }
            
            if (frontendUrl && backendUrl) {
              const commentBody = `🚀 Preview environments are ready for commit ${sha.substring(0, 7)}!\n\n[Click here to test the Frontend linked to the Preview Backend](${frontendUrl}?backend=${backendUrl})`;
              
              // Find existing comment by this bot to update it (sticky comment)
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });
              
              const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('🚀 Preview environments are ready'));
              
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: commentBody
                });
                console.log('Successfully updated preview links comment!');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: commentBody
                });
                console.log('Successfully posted preview links!');
              }
            } else {
              console.log('Waiting for both frontend and backend deployments to be ready for this commit.');
            }
